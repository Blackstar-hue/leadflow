name: Leadflow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma validation reads this value but does not connect to the database.
      # It is intentionally a disposable CI-only URL, never a production secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/leadflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
